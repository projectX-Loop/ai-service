# ai-service 로컬 pgvector 개발 전용 구성.
# 운영 서비스 구성·네트워크·비밀 주입은 infrastructure/docker-compose.yml이 소유한다.
services:
  # KAN-16 · 로컬 pgvector. 기본 postgres 이미지엔 확장이 없어 pgvector 이미지를 쓴다.
  # 9/7 ai-service 는 이 db 를 쓰지 않는다(파일 폴백). 도윤 RDS 를 쓰는 compose 에선 이 서비스를 빼도 된다.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: loop
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loop}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d   # V1__knowledge.sql 자동 적용 (최초 1회)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
